name: Fast live refresh (NA precipitation + NA cloud cover)

# Dedicated 5-minute refresh for the two fastest-moving layers. This
# workflow exists because the main workflow's full cycle (all products +
# game-fish matrix + full validation + repo commit, ~20-30 min, serialized)
# cannot keep 5-minute sources fresh, and requesting many frequent
# schedules on one workflow gets GitHub-throttled into hour-long gaps.
#
# Design for speed AND safety:
# - Only 2 product jobs + a lean publish (no gamefish, no selftest).
# - Publish validates the FULL site (all 33 products must stay green)
#   but never commits back to main: it deploys the merged site directly.
#   No commit => no push races, no history spam from 5-minute cycles.
#   The hourly main workflow remains the committing path of record.
# - Precipitation builds on every 5-minute dispatch. The full multi-satellite
#   cloud mosaic runs at UTC minutes :00, :20, and :40 because its full build
#   takes roughly 16-20 minutes. Other dispatches publish precipitation while
#   carrying forward the currently live cloud mosaic.
# - Pages writes share one concurrency lock with the main publisher, so
#   independently completed product builds cannot race full-site deployments.
# - The loud artifact merge (fail rather than deploy stale) is duplicated
#   here: a quiet stale deploy is worse than a red job.
#
# Expected: precipitation can publish on each 5-minute dispatch; cloud
# mosaics publish on the 20-minute cadence. GitHub dispatch and Pages queue
# latency remain variable.

on:
  # No GitHub schedule: cron-job.org dispatches this every five minutes.
  # force_cloud is for an operator-requested immediate cloud mosaic.
  workflow_dispatch:
    inputs:
      force_cloud:
        description: "Run the slower cloud mosaic immediately"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The full environment publisher and the fast publishers share one Pages
  # deployment lock. GitHub keeps only one pending job per concurrency group,
  # so a stream of five-minute fast publishers can otherwise replace a
  # waiting full-site publish. Keep fast builds running, but defer only their
  # Pages uploads whenever a full environment workflow is queued or running.
  full_refresh_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - name: Check for an active full environment refresh
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100")"
          active="$(jq --arg current "$CURRENT_RUN_ID" '
            [.workflow_runs[]
             | select((.id | tostring) != $current)
             | select((.name // "") | startswith("Update Great Lakes live environment"))
             | select(.status == "queued" or .status == "pending" or
                      .status == "requested" or .status == "waiting" or
                      .status == "in_progress")]
            | length
          ' <<< "$runs")"
          if [ "$active" -gt 0 ]; then
            echo "A full environment refresh is active; fast Pages publication will defer."
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "No full environment refresh is active; fast Pages publication may proceed."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

  precipitation_na:
    # Independent product queue: the sub-5-minute precipitation builder
    # must not wait behind the slower global cloud mosaic.
    concurrency:
      group: fast-precipitation-na
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Slim deps: keep this list covering the job's imports —
      # build_precipitation_na needs scipy (crossfade/resample/despeckle),
      # rasterio (+affine) for the OPERA reproject, and eccodes for GFS
      # GRIB reads. (Full requirements.txt carries planetary/etc. for the
      # heavy products; installing all of it 3x per 5-minute cycle is the
      # bulk of runner time.)
      - name: Install dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1" "scipy>=1.10" "rasterio>=1.3" "eccodes>=2.30"
      - name: Update NA precipitation
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rc=0; python scripts/build_precipitation_na.py || rc=$?
          if [ $rc -eq 2 ]; then echo "NA precipitation source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-precipitation_na
          path: |
            site/precipitation_na
            site/precipitation_na_basin
            site/precipitation_na_continental
            site/precipitation_na_global
            site/kml/North_America_Live_Precipitation.kml
            site/kml/live/North_America_Live_Precipitation.kml
            kml/North_America_Live_Precipitation.kml
            output/state/precipitation_na.json
          if-no-files-found: warn

  cloud_cadence:
    # Evaluate the 20-minute cadence in a tiny independent job. The result is
    # consumed by cloud_cover_na's job-level if, before cloud concurrency is
    # acquired. Precipitation has no dependency on this check.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.cadence.outputs.run }}
    steps:
      - id: cadence
        name: Check 20-minute cloud cadence
        shell: bash
        run: |
          minute="$(date -u +%M)"
          if (( 10#$minute % 20 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Cloud mosaic due at UTC minute $minute."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Cloud mosaic not due at UTC minute $minute; precipitation can publish without waiting for cloud."
          fi

  cloud_cover_na:
    # Evaluate cadence before acquiring the concurrency slot. Non-due
    # 5-minute dispatches must skip immediately so they never queue behind
    # a slow mosaic or delay the independent precipitation publisher.
    needs: [cloud_cadence]
    if: ${{ inputs.force_cloud || needs.cloud_cadence.outputs.run == 'true' }}
    concurrency:
      group: fast-cloud-cover-na
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Match the full builder's render capabilities: rasterio is required
      # for the GDPS polar cloud blend, not just an optional speed enhancement.
      # Keep the remaining dependency set slim while preserving that output.
      - name: Install dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1" "h5netcdf>=1.0" "h5py>=3.0" "pyproj>=3.6" "scipy>=1.10" "rasterio>=1.3"
      - name: Update NA cloud cover
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rc=0; python scripts/build_cloud_cover_na.py || rc=$?
          if [ $rc -eq 2 ]; then echo "NA cloud source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-cloud_cover_na
          path: |
            site/cloud_cover_na
            site/cloud_cover_na_basin
            site/cloud_cover_na_continental
            site/cloud_cover_na_global
            site/kml/North_America_Live_Cloud_Cover.kml
            site/kml/live/North_America_Live_Cloud_Cover.kml
            kml/North_America_Live_Cloud_Cover.kml
            output/state/cloud_cover_na.json
          if-no-files-found: warn

  notify-ais:
    # Chain the AIS repo into the 5-minute cadence: cron-job.org fires this
    # workflow every 5 min; this forwards a repository_dispatch so
    # great-lakes-live-tracking-8-31-26 rebuilds on the same timer (its own
    # GitHub schedule is disabled). Standalone + best-effort: never in
    # fast_publish's needs, never fails the run.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dispatch AIS rebuild
        env:
          TOKEN: ${{ secrets.AIS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "AIS_DISPATCH_TOKEN not set; skipping AIS chain."; exit 0; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wyattleathorn7/great-lakes-live-tracking-8-31-26/dispatches \
            -d '{"event_type":"five_min"}') || code="000"
          echo "AIS dispatch HTTP $code"
          [ "$code" = "204" ] || echo "::warning::AIS chain dispatch returned $code (expected 204)"

  precipitation_publish:
    # Publish precipitation as soon as its own builder finishes, unless a
    # full-site refresh needs the shared Pages lock.
    needs: [precipitation_na, full_refresh_gate]
    if: needs.full_refresh_gate.outputs.active != 'true'
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The publisher may wait behind another Pages deploy; start from
          # the latest committed full site once its deploy lock is acquired.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1"
      - name: Download precipitation artifact only
        uses: actions/download-artifact@v8
        with:
          name: site-precipitation_na
          path: artifacts
      - name: Merge precipitation artifact
        shell: bash
        run: |
          set -euo pipefail
          merged=0
          for t in site kml output; do
            if [ -d "artifacts/$t" ]; then
              mkdir -p "$t"
              cp -r "artifacts/$t/." "./$t/"
              merged=$((merged+1))
            fi
          done
          if [ "$merged" -eq 0 ]; then
            echo "ERROR: precipitation artifact contained no expected trees"
            find artifacts -maxdepth 3 -type f -print
            exit 1
          fi
          echo "Merged $merged precipitation artifact trees."
      - name: Preserve newer live fast products and verify freshness
        run: |
          python scripts/publish_guard.py \
            --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --site site \
            --sync-live-fast
      - name: Validate outputs
        run: python scripts/validate_outputs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-precipitation
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-precipitation

  cloud_publish:
    # Cloud publication is independent of precipitation and runs only when
    # the cloud cadence job actually launched a cloud build, unless a full-site
    # refresh needs the shared Pages lock.
    needs: [cloud_cover_na, full_refresh_gate]
    if: needs.full_refresh_gate.outputs.active != 'true'
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The publisher may wait behind another Pages deploy; start from
          # the latest committed full site once its deploy lock is acquired.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1"
      - name: Download cloud artifact only
        uses: actions/download-artifact@v8
        with:
          name: site-cloud_cover_na
          path: artifacts
      - name: Merge cloud artifact
        shell: bash
        run: |
          set -euo pipefail
          merged=0
          for t in site kml output; do
            if [ -d "artifacts/$t" ]; then
              mkdir -p "$t"
              cp -r "artifacts/$t/." "./$t/"
              merged=$((merged+1))
            fi
          done
          if [ "$merged" -eq 0 ]; then
            echo "ERROR: cloud artifact contained no expected trees"
            find artifacts -maxdepth 3 -type f -print
            exit 1
          fi
          echo "Merged $merged cloud artifact trees."
      - name: Preserve newer live fast products and verify freshness
        run: |
          python scripts/publish_guard.py \
            --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --site site \
            --sync-live-fast
      - name: Validate outputs
        run: python scripts/validate_outputs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-cloud
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-cloud
