name: Fast live refresh (NA precipitation + NA cloud cover)

# Dedicated 5-minute refresh for the two fastest-moving layers. This
# workflow exists because the main workflow's full cycle (all products +
# game-fish matrix + full validation + repo commit, ~20-30 min, serialized)
# cannot keep 5-minute sources fresh, and requesting many frequent
# schedules on one workflow gets GitHub-throttled into hour-long gaps.
#
# Design for speed AND safety:
# - Only 2 product jobs + a lean publish (no gamefish, no selftest).
# - Publish validates the FULL site (all 33 products must stay green)
#   but never commits back to main: it deploys the merged site directly.
#   No commit => no push races, no history spam from 5-minute cycles.
#   The hourly main workflow remains the committing path of record.
# - Precipitation builds on every 5-minute dispatch. The full multi-satellite
#   cloud mosaic runs at UTC minutes :00, :20, and :40 because its full build
#   takes roughly 16-20 minutes. Other dispatches publish precipitation while
#   carrying forward the currently live cloud mosaic.
# - Pages writes share one concurrency lock with the main publisher, so
#   independently completed product builds cannot race full-site deployments.
# - The loud artifact merge (fail rather than deploy stale) is duplicated
#   here: a quiet stale deploy is worse than a red job.
#
# Expected: precipitation can publish on each 5-minute dispatch; cloud
# mosaics publish on the 20-minute cadence. GitHub dispatch and Pages queue
# latency remain variable.

on:
  # No GitHub schedule: cron-job.org dispatches this every five minutes.
  # force_cloud is for an operator-requested immediate cloud mosaic.
  workflow_dispatch:
    inputs:
      force_cloud:
        description: "Run the slower cloud mosaic immediately"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  precipitation_na:
    # Independent product queue: the sub-5-minute precipitation builder
    # must not wait behind the slower global cloud mosaic.
    concurrency:
      group: fast-precipitation-na
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Slim deps: keep this list covering the job's imports —
      # build_precipitation_na needs scipy (crossfade/resample/despeckle),
      # rasterio (+affine) for the OPERA reproject, and eccodes for GFS
      # GRIB reads. (Full requirements.txt carries planetary/etc. for the
      # heavy products; installing all of it 3x per 5-minute cycle is the
      # bulk of runner time.)
      - name: Install dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1" "scipy>=1.10" "rasterio>=1.3" "eccodes>=2.30"
      - name: Update NA precipitation
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rc=0; python scripts/build_precipitation_na.py || rc=$?
          if [ $rc -eq 2 ]; then echo "NA precipitation source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-precipitation_na
          path: |
            site/precipitation_na
            site/precipitation_na_basin
            site/precipitation_na_continental
            site/precipitation_na_global
            site/kml/North_America_Live_Precipitation.kml
            site/kml/live/North_America_Live_Precipitation.kml
            kml/North_America_Live_Precipitation.kml
            output/state/precipitation_na.json
          if-no-files-found: warn

  cloud_cover_na:
    # Evaluate cadence before acquiring the concurrency slot. Non-due
    # 5-minute dispatches must skip immediately so they never queue behind
    # a slow mosaic or delay the independent precipitation publisher.
    if: ${{ inputs.force_cloud || contains(github.run_started_at, ':00:') || contains(github.run_started_at, ':20:') || contains(github.run_started_at, ':40:') }}
    concurrency:
      group: fast-cloud-cover-na
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Slim deps: the GOES fetcher needs h5netcdf (+ its h5py backend)
      # and pyproj on top of numpy/PIL, plus scipy for the IR render
      # (see note on precipitation above).
      - name: Install dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1" "h5netcdf>=1.0" "h5py>=3.0" "pyproj>=3.6" "scipy>=1.10"
      - name: Update NA cloud cover
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rc=0; python scripts/build_cloud_cover_na.py || rc=$?
          if [ $rc -eq 2 ]; then echo "NA cloud source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-cloud_cover_na
          path: |
            site/cloud_cover_na
            site/cloud_cover_na_basin
            site/cloud_cover_na_continental
            site/cloud_cover_na_global
            site/kml/North_America_Live_Cloud_Cover.kml
            site/kml/live/North_America_Live_Cloud_Cover.kml
            kml/North_America_Live_Cloud_Cover.kml
            output/state/cloud_cover_na.json
          if-no-files-found: warn

  notify-ais:
    # Chain the AIS repo into the 5-minute cadence: cron-job.org fires this
    # workflow every 5 min; this forwards a repository_dispatch so
    # great-lakes-live-tracking-8-31-26 rebuilds on the same timer (its own
    # GitHub schedule is disabled). Standalone + best-effort: never in
    # fast_publish's needs, never fails the run.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dispatch AIS rebuild
        env:
          TOKEN: ${{ secrets.AIS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "AIS_DISPATCH_TOKEN not set; skipping AIS chain."; exit 0; fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wyattleathorn7/great-lakes-live-tracking-8-31-26/dispatches \
            -d '{"event_type":"five_min"}') || code="000"
          echo "AIS dispatch HTTP $code"
          [ "$code" = "204" ] || echo "::warning::AIS chain dispatch returned $code (expected 204)"

  fast_publish:
    needs: [precipitation_na, cloud_cover_na]
    # Shared with the main workflow publisher: only one Pages deployment at a time.
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    # Ship whatever succeeded; a single-source outage must not block the
    # other layer, and must never block on a red job.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Slim deps: validation needs only numpy/PIL + local modules
      # (build_surface_currents' third-party imports are numpy/PIL at
      # module level; pydap is function-lazy).
      - name: Install dependencies
        run: pip install "numpy>=1.26" "pillow>=10.1"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge product artifacts into site/
        run: |
          shopt -s nullglob
          merged=0
          # Multi-artifact layout: one subdir per artifact name.
          for a in artifacts/site-*/; do
            [ -d "$a" ] || continue
            echo "merging: $a"
            cp -r "$a/." ./
            merged=$((merged+1))
          done
          # Single-artifact layout: a lone artifact extracts FLAT into
          # path/ (no per-name subdir). Missing this once caused silent
          # stale deploys; handle it explicitly.
          for t in site kml output; do
            if [ -d "artifacts/$t" ]; then
              echo "merging flat tree: artifacts/$t"
              mkdir -p "$t"
              cp -r "artifacts/$t/." "./$t/"
              merged=$((merged+1))
            fi
          done
          echo "merged $merged artifact trees"
          if [ "$merged" -eq 0 ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "ERROR: artifacts present but none merged; refusing to deploy stale files"
            exit 1
          fi
          git status --porcelain=v1 --untracked-files=no -- site kml output/state | head -30
        shell: bash
      # Never publish a merge-lane product OLDER than what Pages already
      # serves (observed regression: the fast lane deployed cloud rasters
      # ~7 GOES cycles behind the live site, 2026-11-01).
      - name: Guard against stale publish
        run: |
          python scripts/publish_guard.py \
            --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --site site \
            --sync-live-fast
      - name: Validate outputs
        run: python scripts/validate_outputs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
