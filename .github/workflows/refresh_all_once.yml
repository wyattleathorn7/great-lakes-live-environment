name: One-time environmental refresh trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh_all_once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Run one-time full environmental refresh'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch full environmental refresh and forced fast refresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update_environment.yml/dispatches" \
            -f ref=main -f "inputs[product]=environmental"
          environmental_status=$?

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update_fast_live.yml/dispatches" \
            -f ref=main -F "inputs[force_cloud]=true"
          fast_status=$?

          if [ "$environmental_status" -ne 0 ] || [ "$fast_status" -ne 0 ]; then
            echo "::error::One or both refresh dispatches failed (environmental=$environmental_status, fast=$fast_status)."
            exit 1
          fi
          echo "Both refresh requests were accepted."

      - name: Remove one-time dispatcher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          file_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/refresh_all_once.yml?ref=main" \
            --jq .sha 2>/dev/null)"
          if [ -n "$file_sha" ]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/refresh_all_once.yml" \
              -f message="Remove one-time environmental refresh dispatcher" \
              -f sha="$file_sha" -f branch=main
          else
            echo "One-time dispatcher is already absent."
          fi
