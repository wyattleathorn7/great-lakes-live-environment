name: Leaf HLS build check (temporary)

# TEMPORARY validation workflow for the HLS leaf rebuild. It runs the real
# leaf builder on the feature branch and verifies the rendered raster,
# metadata and KML, but never publishes and never writes to main.
# Deleted before merge.

on:
  push:
    branches: [leaf-season-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build leaf color from NASA HLS
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/build_leaf_color.py
      - name: Verify output
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from PIL import Image

          meta = json.load(open("site/leaf_color/metadata.json"))
          png = np.array(Image.open("site/leaf_color/current.png").convert("RGBA"))
          legend = np.array(Image.open("site/leaf_color/legend.png").convert("RGB"))
          water = np.array(Image.open("assets/great_lakes_watermask.png").convert("L"))
          a = png[:, :, 3] > 0
          print("source_id", meta.get("source_id"))
          print("provider", meta.get("provenance", {}).get("provider"))
          print("composite", meta.get("provenance", {}).get("composite_date"))
          print("opaque", int(a.sum()), "shape", png.shape)
          print("legend colors", len(np.unique(legend.reshape(-1, 3), axis=0)))
          print("raster colors", len(np.unique(png[a][:, :3].reshape(-1, 3), axis=0)))
          print("water bleed", int((a & (water > 250)).sum()))
          print("coverage", meta.get("stats", {}).get("coverage_fraction"))
          print("phase_mean", meta.get("stats", {}).get("phase_mean"))
          print("seasonal_anchor", meta.get("provenance", {}).get("seasonal_anchor"))
          print("stale_dropped", meta.get("stats", {}).get("stale_dropped_pixels"))
          assert png.shape[:2] == (1175, 1800)
          assert int(a.sum()) > 50000
          assert int((a & (water > 250)).sum()) == 0
          assert meta["provenance"]["provider"].startswith("NASA HLS")
          assert meta["provenance"]["collections"] == ["hls2-l30", "hls2-s30"]
          assert meta["source_id"].startswith("leaf-hls-v2-")
          assert meta["provenance"]["freshness_cap_days"] == 21
          assert "seasonal_anchor" in meta["provenance"]
          assert meta["stats"]["coverage_fraction"] >= 0.999
          assert meta["stats"]["phase_mean"] >= 0.75
          assert len(np.unique(png[a][:, :3].reshape(-1, 3), axis=0)) >= 50
          kml = open("site/kml/live/Great_Lakes_Live_Leaf_Color.kml").read()
          assert kml.count("<GroundOverlay>") == 1
          assert "<north>49.5</north>" in kml and "<south>40.5</south>" in kml
          assert "<west>-93.0</west>" in kml and "<east>-73.5</east>" in kml
          print("VERIFIED")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: leaf-hls-check-output
          path: |
            site/leaf_color
            site/kml/Great_Lakes_Live_Leaf_Color.kml
            site/kml/live/Great_Lakes_Live_Leaf_Color.kml
            kml/Great_Lakes_Live_Leaf_Color.kml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: leaf-hls-check-state
          path: |
            output/state/leaf_color.json
            output/state/leaf_color
