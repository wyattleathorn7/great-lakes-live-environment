name: One-time clear stalled Pages publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free_pages_lock_once.yml"

permissions:
  actions: write
  contents: write

jobs:
  clear-lock:
    if: github.event.head_commit.message == 'Free publishing lock for current full refresh'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stalled pre-deployment publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/44132101933/cancel"
          echo "Cancellation requested for the stalled half-hourly run."

      - name: Remove one-time dispatcher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          file_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/free_pages_lock_once.yml?ref=main" \
            --jq .sha 2>/dev/null)"
          if [ -n "$file_sha" ]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/free_pages_lock_once.yml" \
              -f message="Remove one-time Pages lock dispatcher" \
              -f sha="$file_sha" -f branch=main
          fi
