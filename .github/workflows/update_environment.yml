name: Update Great Lakes live environment

on:
  schedule:
    # Per-product source cadence (each job runs only on its own cron;
    # every builder is ALSO source-aware and skips when the source id
    # is unchanged, so off-cadence wakeups never rebuild/republish):
    # - hourly: sub-daily sources (HRRR hourly, GFS 6-hourly discovery,
    #   UVI forecast-hour advance).
    - cron: "15 * * * *"
    # - 4x daily: 6-hourly GLWU cycles + daily/irregular sources
    #   (GLSEA, NIC NAIS, VIIRS composites, ERDDAP dailies).
    - cron: "35 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Which product to update"
        required: false
        default: "all"
        type: choice
        options: ["all", "wave_height", "water_temperature", "ice_coverage",
                  "ice_thickness", "ice_type", "wind", "leaf_color",
                  "chlorophyll", "water_clarity", "solar_radiation",
                  "air_temperature", "snow_coverage", "uv_index", "gamefish"]

# Least privilege: product jobs only read the repo; only `publish` writes
# back results and deploys Pages.
permissions:
  contents: read

# Pinned to 24.04 for deterministic builds: GitHub migrates `ubuntu-latest`
# to 26.04 beginning 2026-10-19, which must be validated before adopting.
concurrency:
  group: live-environment
  cancel-in-progress: false

jobs:
  wave_height:
    if: ${{ github.event.schedule == '15 * * * *' || inputs.product == 'all' || inputs.product == 'wave_height' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update wave height
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        # Exit 2 = source unavailable/invalid -> keep previous raster, stay green.
        run: |
          python scripts/build_wave_height.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Wave source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-wave_height
          path: |
            site/wave_height
            output/state/wave_height.json
            site/kml/Great_Lakes_Live_Wave_Height.kml
            site/kml/live/Great_Lakes_Live_Wave_Height.kml
            kml/Great_Lakes_Live_Wave_Height.kml
          if-no-files-found: warn

