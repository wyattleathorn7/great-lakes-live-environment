name: Update Great Lakes live environment

on:
  schedule:
    # Every 6 h matches the fastest source (NCEP GLWU cycles).
    # Daily products (GLSEA, NIC ice) skip automatically when the source
    # file is unchanged, so no unnecessary rebuilds or commits occur.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Which product to update"
        required: false
        default: "all"
        type: choice
        options: ["all", "wave_height", "water_temperature", "ice_coverage",
                  "ice_thickness", "ice_type"]

# Least privilege: product jobs only read the repo; only `publish` writes
# back results and deploys Pages.
permissions:
  contents: read

# Pinned to 24.04 for deterministic builds: GitHub migrates `ubuntu-latest`
# to 26.04 beginning 2026-10-19, which must be validated before adopting.
concurrency:
  group: live-environment
  cancel-in-progress: false

jobs:
  wave_height:
    if: ${{ github.event_name == 'schedule' || inputs.product == 'all' || inputs.product == 'wave_height' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update wave height
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        # Exit 2 = source unavailable/invalid -> keep previous raster, stay green.
        run: |
          python scripts/build_wave_height.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Wave source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-wave_height
          path: |
            site/wave_height
            site/kml/Great_Lakes_Live_Wave_Height.kml
            kml/Great_Lakes_Live_Wave_Height.kml
          if-no-files-found: warn

  water_temperature:
    if: ${{ github.event_name == 'schedule' || inputs.product == 'all' || inputs.product == 'water_temperature' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update water temperature
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/build_water_temperature.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Temperature source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-water_temperature
          path: |
            site/water_temperature
            site/kml/Great_Lakes_Live_Water_Temperature.kml
            kml/Great_Lakes_Live_Water_Temperature.kml
          if-no-files-found: warn

  ice_coverage:
    if: ${{ github.event_name == 'schedule' || inputs.product == 'all' || inputs.product == 'ice_coverage' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update ice coverage
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/build_ice_coverage.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Ice source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-ice_coverage
          path: |
            site/ice_coverage
            site/kml/Great_Lakes_Live_Ice_Coverage.kml
            kml/Great_Lakes_Live_Ice_Coverage.kml
          if-no-files-found: warn

  ice_thickness:
    if: ${{ github.event_name == 'schedule' || inputs.product == 'all' || inputs.product == 'ice_thickness' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update ice thickness
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/build_ice_thickness.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Ice thickness source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-ice_thickness
          path: |
            site/ice_thickness
            site/kml/Great_Lakes_Live_Ice_Thickness.kml
            kml/Great_Lakes_Live_Ice_Thickness.kml
          if-no-files-found: warn

  ice_type:
    if: ${{ github.event_name == 'schedule' || inputs.product == 'all' || inputs.product == 'ice_type' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update ice type
        env:
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/build_ice_type.py; rc=$?
          if [ $rc -eq 2 ]; then echo "Ice type source unavailable; previous raster kept."; exit 0; fi
          exit $rc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-ice_type
          path: |
            site/ice_type
            site/kml/Great_Lakes_Live_Ice_Type.kml
            kml/Great_Lakes_Live_Ice_Type.kml
          if-no-files-found: warn

  publish:
    needs: [wave_height, water_temperature, ice_coverage, ice_thickness, ice_type]
    # Publish whatever succeeded; a single-product failure must not block
    # the other two layers from reaching GitHub Pages.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Merge product artifacts into site/
        run: |
          for a in artifacts/site-*/; do
            [ -d "$a" ] || continue
            cp -r "$a." ./ 2>/dev/null || true
          done
          ls -R site | head -30
        shell: bash
      - name: Validate outputs
        run: python scripts/validate_outputs.py
      - name: Commit updated layers back to repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update live Great Lakes layers"
          file_pattern: "site kml output/state"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
