name: One-time clear superseded publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/free_pages_lock_once.yml"

permissions:
  actions: write
  contents: write

jobs:
  clear-lock:
    if: github.event.head_commit.message == 'Clear superseded half-hourly publish for full refresh'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded half-hourly deployment if still active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run="44137663110"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run" --jq .status)"
          if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "pending" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel"
            echo "Cancellation requested to release the Pages lock for the newer full environmental refresh."
          else
            echo "Older half-hourly run already finished ($status); no cancellation needed."
          fi

      - name: Remove one-time dispatcher
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          file_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/free_pages_lock_once.yml?ref=main" \
            --jq .sha 2>/dev/null)"
          if [ -n "$file_sha" ]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/free_pages_lock_once.yml" \
              -f message="Remove one-time publisher lock dispatcher" \
              -f sha="$file_sha" -f branch=main
          fi
